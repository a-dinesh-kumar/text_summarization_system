services:
  backend:
    container_name: text-summarization-system-backend

    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production

    env_file:
      - ./backend/.env

    expose:
      - "8000"

    volumes:
      - huggingface_cache:/app/.cache/huggingface

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  frontend:
    container_name: text-summarization-system-frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  huggingface_cache:
